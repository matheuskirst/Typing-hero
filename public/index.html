<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Hero</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
</head>
<body class="bg-grid">
    <header>
        <div class="top-bar">
            <div class="user-status">
                <span class="user-icon">👤</span>
                <span id="userInfo">Carregando...</span>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="settingsModalBtn" class="cyber-nav-btn">⚙️ CONFIG</button>
                <a id="authActionBtn" href="auth.html" class="auth-btn">
                    Entrar / Cadastrar
                </a>
            </div>
        </div>
    </header>
    <main>
        <h1>TYPING HERO</h1>
        <p>Escolha o seu ritmo e digite com precisão</p>

        <div id="central-container">
            <div id="leaderboard-container">
                <h2>Placar Global</h2>
                <div id="leaderboard-controls">
                    <button id="leaderboard-sort-score">Pontos</button>
                    <button id="leaderboard-sort-wmp">WPM</button>
                </div>
    
                <table id="leaderboard-table">
                    <tr>
                        <th>#</th>
                        <th>Jogador</th>
                        <th>Rank</th>
                        <th>WPM</th>
                        <th>Pontos</th>
                    </tr>
                </table>
            </div>
        </div>
    </main>

    <script type="module" src="./main.js"></script>
</body>
</html>
